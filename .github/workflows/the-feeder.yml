name: The Feeder (Data Ingestion)

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r feeder/requirements.txt

      - name: Run The Feeder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: "alyamemoryzz"
        run: python feeder/main.py

      - name: Commit Ingestion Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data ingestion log"
          file_pattern: "logs/ingested_*.md"
